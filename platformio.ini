; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; utile pour les modèles un peu gros
board_build.partitions = huge_app.csv
; active la PSRAM si ta carte en a (WROVER, TTGO, etc.)
; board_build.psram = enabled

monitor_speed = 115200

build_flags =
  -D TF_LITE_STATIC_MEMORY
  -Wno-deprecated-declarations

lib_deps =
  ; TFLite Micro pour ESP32 (fourni avec flatbuffers et optims Xtensa)
  https://github.com/eloquentarduino/Arduino_TensorFlowLite_ESP32.git
  ; Tes autres libs
  adafruit/Adafruit Unified Sensor
  adafruit/DHT sensor library
  adafruit/Adafruit SSD1306
